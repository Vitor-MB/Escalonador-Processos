<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Escalonador - Corecaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>


<body>
  <div class="wrap">

    <div id="errorBanner" class="error-banner" style="display:none;"></div>

    <div class="card">
      <h2>Algoritmo</h2>

      <div class="algo-row">
        <div>
          <label for="algo">Política de escalonamento</label>
          <select id="algo">
            <option value="fcfs">FCFS — First Come, First Served</option>
            <option value="sjf">SJF — Shortest Job First</option>
            <option value="srtf">SRTF — Shortest Remaining Time First</option>
            <option value="prio-np">Prioridade, sem preempção</option>
            <option value="prio-p">Prioridade, com preempção</option>
            <option value="rr">Round-Robin com quantum, sem prioridade</option>
            <option value="rr-prio-aging">Round-Robin com prioridade e envelhecimento</option>
          </select>
        </div>

        <div class="extra" id="quantumBox">
          <div>
            <label for="quantum">Quantum</label>
            <input id="quantum" type="number" min="1" value="2">
          </div>
        </div>


        <div class="extra" id="agingBox">
          <div>
            <label for="aging">Envelhecimento (unidades p/ +1 prioridade)</label>
            <input id="aging" type="number" min="1" value="3">
          </div>
        </div>
    </div>

    <h2>Entrada por texto</h2>
    <div class="algo-row" style="align-items:start;">
      <div style="flex:2; min-width:260px;">
        <label for="rawInput">Processos ( [chegada] [duração] [prioridade] )</label>
        <textarea id="rawInput" class="entradaTexto" rows="5" placeholder="0 5 2&#10;0 2 3&#10;1 4 1&#10;3 3 4"></textarea>
      </div>

      <div style="flex:1; min-width:180px;">
        <label for="rawConfig">Config (quantum/aging)</label>
        <textarea id="rawConfig" class="entradaTexto" rows="5" placeholder="quantum:2&#10;aging:1" ></textarea>
      </div>
    </div>

    <div class="actions BtnProc">
      <button class="main run" onclick="applyRawInput()">Criar Processos</button>
    </div>

      <h2>Processos</h2>
      <table class="proc" id="procTable">
        <thead><tr><th></th><th>Processo</th><th>Chegada</th><th>Duração</th><th>Prioridade</th><th></th></tr></thead>
        <tbody id="procBody"></tbody>
      </table>
      <div class="actions">
        <button class="main add" onclick="addRow()">+ Adicionar processo</button>
        <button class="main run" onclick="run()">Rodar simulação</button>
      </div>
      
      <div class="algo-row" style="margin-top:6px;">
        <div class="sel-speed">
          <label for="speed">Velocidade do tick</label>
          
          <select id="speed">
            <option value="1000">Lenta (1s)</option>
            <option value="500" selected>Normal (0.5s)</option>
            <option value="200">Rápida (0.2s)</option>
            <option value="60">Turbo (0.06s)</option>
          </select>
        </div>
      </div>
      
    </div>

    <div class="card" id="resultCard" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
        <h2 style="margin:0;">Linha do tempo</h2>
        <div style="display:flex; gap:8px;">
          <button class="main run" id="viewToggleBtn" onclick="toggleView()">Ver como texto</button>
          <button class="main run" id="playBtn" onclick="togglePlay()">Play</button>
          <button class="main run" onclick="resetPlay()">Reiniciar</button>
        </div>
      </div>

      <div class="gantt" id="ganttView"><div class="gantt-inner" id="ganttInner"></div></div>
      <pre class="textout" id="textView" style="display:none;"></pre>

      <div class="legend" id="legend"></div>
      <p class="hint" id="clockLine">t = 0</p>
      <h2 style="margin-top:22px;">Métricas</h2>
      <table class="metrics" id="metricsTable"></table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
